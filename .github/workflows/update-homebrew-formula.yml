name: update-homebrew-formula

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        type: string

jobs:
  update-formula:
    runs-on: ubuntu-latest

    steps:
      - name: Derive asset URL
        id: vars
        shell: bash
        run: |
          TAG="${{ inputs.tag }}"
          VERSION="${TAG#v}"
          ASSET_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/WiFiSnitch-${VERSION}.zip"

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "asset_url=${ASSET_URL}" >> "$GITHUB_OUTPUT"

      - name: Download release archive
        shell: bash
        run: |
          curl -fL "${{ steps.vars.outputs.asset_url }}" -o WiFiSnitch.zip

      - name: Compute SHA-256
        id: sha
        shell: bash
        run: |
          SHA="$(sha256sum WiFiSnitch.zip | awk '{print $1}')"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Checkout Homebrew tap
        uses: actions/checkout@v6
        with:
          repository: gi8lino/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update formula
        shell: bash
        run: |
          FORMULA_FILE="homebrew-tap/Formula/wifisnitch.rb"
          mkdir -p "$(dirname "${FORMULA_FILE}")"

          VERSION="${{ steps.vars.outputs.version }}"
          SHA="${{ steps.sha.outputs.sha }}"

          cat > "${FORMULA_FILE}" <<EOF
          class Wifisnitch < Formula
            desc "Background macOS Wi-Fi and network status agent with CLI access"
            homepage "https://github.com/gi8lino/wifi-snitch"
            url "https://github.com/gi8lino/wifi-snitch/releases/download/v${VERSION}/WiFiSnitch-${VERSION}.zip"
            sha256 "${SHA}"
            license "Apache-2.0"
            version "${VERSION}"

            depends_on macos: :sonoma

            def install
              libexec.install "WiFiSnitch.app"
              bin.install "wifisnitchctl"

              (bin/"wifisnitch").write <<~SH
                #!/bin/bash
                exec "#{libexec}/WiFiSnitch.app/Contents/MacOS/WiFiSnitch" "\$@"
              SH

              (var/"log/wifisnitch").mkpath
            end

            service do
              run [opt_bin/"wifisnitch"]
              environment_variables PATH: std_service_path_env, LANG: "en_US.UTF-8"
              keep_alive true
              process_type :interactive
              working_dir HOMEBREW_PREFIX
              log_path var/"log/wifisnitch/wifisnitch.out.log"
              error_log_path var/"log/wifisnitch/wifisnitch.err.log"
            end

            test do
              assert_match "wifisnitchctl", shell_output("#{bin}/wifisnitchctl --help 2>&1")
            end
          end
          EOF

      - name: Commit and push changes
        shell: bash
        run: |
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Formula/wifisnitch.rb

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "wifisnitch ${{ steps.vars.outputs.version }}"
          git push
